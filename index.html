
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ApplyWise - Login</title>
<meta name="description" content="ApplyWise Job Application Tracker Login">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,
    #080F24, #142B55, #0B1730);
}

.login-card {
  width: 100%;
  max-width: 420px;
  padding: 42px 35px;
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  color: #2563EB;
  margin-bottom: 8px;
  letter-spacing: -1px;
}

.logo-icon {
  width: 54px;
  height: 54px;
  margin: 0 auto 12px;
  border-radius: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #2563EB;
  color: white;
  font-size: 26px;
}

.tagline {
  text-align: center;
  color: #64748B;
  font-size: 11px;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

h2 {
  text-align: center;
  color: #101828;
  font-size: 25px;
  margin-bottom: 9px;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 28px;
  font-size: 14px;
}

label {
  display: block;
  color: #172554;
  font-weight: 700;
  font-size: 14px;
  margin: 17px 0 9px;
}

input {
  width: 100%;
  padding: 15px;
  background: #EFF6FF;
  border: 1.5px solid #DBEAFE;
  border-radius: 10px;
  font-size: 15px;
  color: #101828;
  transition: .3s;
}

input::placeholder {
  color: #94A3B8;
}

input:focus {
  outline: none;
  background: #F8FBFF;
  border-color: #2563EB;
  box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 25px;
  background: linear-gradient(90deg,
    #2563EB, #1D4ED8);
  color: #FFFFFF;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: #1746B0;
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(37,99,235,.25);
}

.footer {
  text-align: center;
  color: #98A2B3;
  font-size: 12px;
  margin-top: 25px;
}

@media(max-width:480px) {
  .login-card {
    padding: 32px 23px;
  }
}
</style>
</head>

<body>

<div class="login-card">

  <div class="logo-icon">✦</div>

  <div class="logo">ApplyWise</div>

  <div class="tagline">JOB APPLICATION TRACKER</div>

  <h2>Welcome Back!</h2>

  <p class="subtitle">
    Login to your account
  </p>

  <form id="loginForm">

    <label>Email Address</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">
      Login to ApplyWise
    </button>

  </form>

  <div class="footer">
    Secure Login · ApplyWise
  </div>

</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(e) {
  e.preventDefault();

  alert("Authentication needs to be connected to your account system.");
});
</script>

</body>
</html>
